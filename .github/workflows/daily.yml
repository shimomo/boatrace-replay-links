name: daily

on:
  schedule:
    - cron: "0 22 * * *" # 07:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test
      - id: build
        continue-on-error: true # 1日分の失敗で、成功した日の追加まで止めない
        run: node scripts/build.mjs --source http --from 2020-01-01 --missing-only
      - name: Commit new files
        if: steps.build.outcome != 'skipped'
        run: |
          if [ -n "$(git status --porcelain api)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add api
            git commit -m "chore: 日次JSONを追加する"
            git push
          fi
      - name: Fail the run if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
